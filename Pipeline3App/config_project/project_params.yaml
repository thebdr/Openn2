# Parameters

project_code: "8XXX"

# --- input documents -------------------------------------------------------- #


io_list:      # The I/O List workbook ::: validation checks format and cross-checks it against the Cause & Effect matrix
  path: "C:\\Source\\Repos\\_Openn2\\Shared\\DocumentsValidationData\\Passing\\8XXX_IOyyyy_R0.0_EmergencyIoListValidationTemplate.xlsx"
  sheet: 'NET SAFETY \d{1,3}/gmi'                                                                       # a single sheet name, a list of names or a regular expression
  header_row: 1

# Parameters
strike_handling: "exclude"                                                                               # how struck-through I/O List rows (even partiallly) are treated. exclude=do not process, ignore=process anyway, error=log as error
ce_mandatory_words: ["emergency", "safety", "relay", "contactor", "enable"]                             # A row's description naming a safety concept must appear in the C&E.
ce_excluded_words: ["circuit breaker", "power supply", "profinet switch", "coupler", "door"]            # rows containing these words are skipped, unless 'ce_full_check'
ce_always_excluded_words: ["ch2"]                                                                       # always skipped, even under ce_full_check
ce_fuzzy_chars: 2                                                                                       # Levenshtein tolerance for word matching (0 disables)
ce_full_check: false                                                                                    # ignore ce_excluded_words (check every row)
ce_full_print: true                                                                                     # log every PASS/SKIP, not just FAIL/WARN
safety_nets: '192.168.5\d'                                                                              # PROFINET safety subnet /24 prefixes


ce:           # The Cause & Effect Matrix workbook ::: validation cross-checks this against the I/O List
  path: "C:\\Source\\Repos\\_Openn2\\Shared\\DocumentsValidationData\\Passing\\8XXX_Cause and Effect Matrix_R0.0_ValidationTemplate.xlsx"
  matrix_sheet: "CAUSE&EFFECT MATRIX"
  matrix_header_row: 2
  matrix_data_row: 5
  area_header_row: 3
  area_data_row: 4
  concept_sheet: "CONCEPT"                         # per-area descriptions (areas_description column)
  concept_row: 2                                   # the row carrying one description per area (positional)

# Parameters
areas: '/AREA\s?\d{1,2}/gmi'                      # C&E Areas List or Regular Expression
sorter_areas: [AREA 1]                            # List of Sorter Areas

# Other Documents (optional overrides; default to the sibling Shared/ tree when omitted)
# device_types_db: "../../Shared/HardwareConfigBuilderData/DeviceTypesDatabase.csv"
# interface_template: "../../Shared/Templates/MachineInterfaces/TEMPLATE_INTERFACES_v0.0.xlsx"


# --- diagnosis -------------------------------------------------------------- #
diag_bit_min: 0                 # valid diagnosis bit range (inclusive)
diag_bit_max: 62


# --- output ----------------------------------------------------------------- #
# This built-in default config writes artifacts to the sibling Shared/OutputTree/. A *project*
# (any project.yaml the GUI creates outside config_project/) carries output_dir: "Output" and so
# writes into <project>/Output. Set an ABSOLUTE output_dir here only to redirect elsewhere.
# output_dir: ""
csv_delimiter: ","
copy_inputs_on_save: false
language: en
device_types_db: ''
interface_template: ''
output_dir: ''


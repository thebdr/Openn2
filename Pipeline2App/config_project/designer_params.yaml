# Parameters — slim base for the I/O List Checker (designer GUI).
# Validation-only: just the two source documents + the Cause&Effect cross-check knobs. The designer
# picks the two files (and toggles Full check / Log everything) inline; everything else stays here.

project_code: "8XXX"

io_list: # The I/O List workbook to validate
  path: ""                        # set via the designer's "I/O List" picker
  sheet: [NET SAFETY 50]          # a sheet name, list of names, or a regular expression
  header_row: 1

ce: # The Cause & Effect Matrix workbook to cross-check against
  path: ""                        # set via the designer's "C&E" picker
  matrix_sheet: "CAUSE&EFFECT MATRIX"
  matrix_header_row: 2
  matrix_data_row: 5
  area_header_row: 3
  area_data_row: 4

# --- validation knobs ------------------------------------------------------- #
strike_handling: "error"          # how struck-through I/O List rows are treated
ce_mandatory_words: ["emergency", "safety", "relay", "contactor", "enable"]
ce_excluded_words: ["circuit breaker", "power supply", "profinet switch", "coupler", "door"]
ce_always_excluded_words: ["ch2"]
ce_fuzzy_chars: 2                 # Levenshtein tolerance for word matching (0 disables)
ce_full_check: true               # ignore ce_excluded_words (check every row)
ce_full_print: true               # log every PASS/SKIP, not just FAIL/WARN
safety_nets: [192.168.50, 192.168.51]
areas: [AREA 1, AREA 2, AREA 3, AREA 4]

language: en
copy_inputs_on_save: false

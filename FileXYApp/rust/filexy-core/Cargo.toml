[package]
name = "filexy-core"
version = "0.1.0"
edition = "2021"
description = "FileXY's pure grid engine, ported from filexy/core.py (the executable spec)."
license = "MIT"

[dependencies]
regex = "1"
calamine = { version = "0.26", features = ["dates"] }   # the xlsx loader (the REAL perf win)
chrono = { version = "0.4", default-features = false, features = ["std"] }  # calamine's date type
caseless = "0.2"   # FULL Unicode case folding = Python's str.casefold (to_lowercase is not: ß->ss)
# pyo3 only when building the Python extension (maturin); `cargo test` stays Python-free.
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py310"], optional = true }

[features]
python = ["dep:pyo3"]

[lib]
name = "filexy_core"
# rlib for `cargo test`; cdylib is the Python extension module maturin packages.
crate-type = ["rlib", "cdylib"]

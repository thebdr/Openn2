project_code: "8XXX"

# --- input documents -------------------------------------------------------- #
iolist_path: "C:\\Source\\Repos\\_Openn2\\Shared\\DocumentsValidationData\\Passing\\8XXX_IOyyyy_R0.0_EmergencyIoListValidationTemplate.xlsx"
iolist_previous_path: "C:\\Source\\Repos\\_Openn2\\Shared\\DocumentsValidationData\\Passing\\8XXX_IOyyyy_R0.0_EmergencyIoListValidationTemplate.xlsx"

matrix_path: "C:\\Source\\Repos\\_Openn2\\Shared\\DocumentsValidationData\\Passing\\8XXX_Cause and Effect Matrix_R0.0_ValidationTemplate.xlsx"
matrix_previous_path: "C:\\Source\\Repos\\_Openn2\\Shared\\DocumentsValidationData\\Passing\\8XXX_Cause and Effect Matrix_R0.0_ValidationTemplate.xlsx"
# the *_previous_path point at the prior document revision - reserved for the future ph100 change-tracing.

iolist_params:
  sheets: '^NET SAFETY \d{1,3}|^r\d+\.s\d+\.c\d+/gmi'     # a single sheet name, a list of names or a regular expression
  header_row: 1
  insert_interface_sheets: true                           # the interface sheets created as output are added to the workbook
  diag_bits_range: [0, 62]                                # valid diagnosis bit range (inclusive)
  diag_bit_min: 0                                          # ph200 §8 diagnosis allocation: lowest bit (node non-P up from here)
  diag_bit_max: 62                                         # ph200 §8 diagnosis allocation: highest bit (node P down from here)

matrix_params:
  sorter_areas: [1]                                       # the Sorter area numbers (matched against the C&E areas)

  ce_sheet:
    name: "CAUSE&EFFECT MATRIX"       # a single sheet name, a list of names or a regular expression
    header_row: 2
    data_row: 5

  area_sheets:
    name: '/AREA\s?\d{1,2}/gmi'       # a single sheet name, a list of names or a regular expression
    header_row: 3
    data_row: 4

  concept_sheet:                      # per-area descriptions (areas_description column)
    name: "CONCEPT"                   # a single sheet name, a list of names or a regular expression
    header_row: 2                     # the row carrying one description per area (positional)


# Phase 100: documents validation (error seeking - helping corrections)
validation_params:
  global:
    strike_handling: "exclude"        # struck-through I/O List rows: exclude=do not process, ignore=process anyway, error=log
    print_all: false                  # log every PASS/SKIP, not just FAIL/WARN

  iolist:
    permanent_parts:                  # canonical safety phrases an A/W/PA/PW permanent-part description must match (ph110)
      - EXTERNALLY INDUCED EMERGENCY
      - EMERGENCY PUSH BUTTON PRESSED
      - EMERGENCY STOP WITH PULL CORD
      - FEEDBACK OF SAFETY RELAY FAULT
      - FEEDBACK OF RELAY FAULT
      - EMERGENCY RESET KEY FAULT
      - SAFETY ENCODER FAILURE
      - FIELD BUS FAILURE - INPUT / OUTPUT MODULE
      - FIELD BUS FAILURE - DRIVE
      - FIELD BUS FAILURE - GATEWAY
      - FIELD BUS FAILURE - COUPLER
      - FIELD BUS FAILURE - BARRIER
      - FIELD BUS MODULE FAILURE
      - PROFINET SWITCH FAULT
      - ETHERNET SWITCH FAULT
      - SWITCH DISCONNECTOR IS OPEN
      - SAFETY DOOR OPEN
      - SAFETY DOOR INTERLOCK FAULT
      - CIRCUIT BREAKER TRIPPED
      - POWER SUPPLY 24V MISSING
      - POWER SUPPLY UNIT FAILURE
      - POWER SUPPLY UNIT OVERCURRENT
      - POWER SUPPLY UNIT OVERTEMPERATURE
      - POWER SUPPLY UNIT FAN NOT WORKING
      - OVERTEMPERATURE ALARM
      - FAULT CONDITIONER
      - EXTERNAL DEVICE FAILURE
      - WHEEL DIAGNOSTIC PC - NOISE WARNING - THRESHOLD 2
      - WHEEL DIAGNOSTIC PC - NOISE WARNING - THRESHOLD 1
      - WHEEL DIAGNOSTIC PC - TEMPERATURE ALARM

  matrix:
    placeholder: false

  crosscheck:
    global:
      full_check: false

    iol_in_matrix:
      mandatory_words: ["emergency", "safety", "relay", "contactor", "enable"]                    # a safety-concept description must appear in the C&E
      excluded_words: ["circuit breaker", "power supply", "profinet switch", "coupler", "door"]   # skipped unless validation_params.global... full_check
      bypass_words: ["ch2"]                                                                       # always skipped, even under full_check
      levenshtein_deviation: 1                                                                    # fuzzy matching (chars accepted; 0 disables)

    matrix_in_iol:
      fld_mismatch_treatment: "error"                                                             # address matches but FLD differs -> treatment


# Output parameters (blank -> the default). output goes to the BuilderData tree OPn imports.
output_dir: ''            # default: project ? <project>/Output : Shared/OutputTree
device_types_db: ''       # default: Shared/HardwareConfigBuilderData/DeviceTypesDatabase.csv
interface_template: ''    # default: Shared/Templates/MachineInterfaces/

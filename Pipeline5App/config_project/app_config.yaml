# PL4 app / GUI launch config - COSMETIC, tracked (NOT per-project run params; those live in
# project_params.yaml). Read by config.load_app_ui and applied when the GUI window starts.

user_interface:
  # GUI language for the chrome (phase bar, toolbar, tabs, status): en | it. Toggled live by the Lang
  # button and persisted here. Unknown -> en.
  language: en
  # Log-viewer font size (the Font dropdown): one of 10 | 12 | 14. Default 10.
  font_size: 12
  # Which log levels the GUI shows. Entries may be single chars OR full names (read by FIRST CHAR):
  #   F = FAIL   E = ERRR   W = WARN   I = INFO   S = SKIP   P = PASS   R = RSLT (phase result)   D = DEBG
  # PHASE section banners always show. (Omit a letter to hide that level.)
  log_levels: [F, E, W, I, R, D]
  # GUI colour theme: dark | light. Toggled live by the Theme button and persisted here. Unknown -> dark.
  theme: dark
  # Tee the log to a timestamped file (ProjectDocumentation/Reports/Logs/pl4_log_<stamp>.txt) while the GUI
  # runs. Toggled live by the 'Log to file' button. true | false.
  log_to_file: true
  # The GUI window size, saved on close. Default 1180 x 720 when absent.
  width: 1920
  height: 1147

# The Files-tab structure: each section = one tree root group. `roots` take ${placeholder}s resolved
# against the ACTIVE config/project, or literal absolute paths. `include`/`exclude` are case-insensitive
# regexes matched (re.search) on each file's path RELATIVE to its root - folders are always traversed and
# empty branches pruned; a file shows when ANY include matches and NO exclude does. A shown file without
# a dedicated viewer still opens via the Open-externally buttons.
# Placeholders: ${config_project} ${user_input} ${database_dir} ${output_root} ${reports}
#               ${iolist} ${matrix} ${project_root}
# A project app_config.yaml WITHOUT this section inherits the app's builtin one; if neither has it, the
# Files tab shows a pointed warning (the structure is never baked into code).
files_tab:
  sections:
  - title: Project configuration
    roots: ['${config_project}']
    include: [.*]
    exclude: [~\$.*, .*\.pyc$, .*\.bak_.*, __pycache__]
  - title: User editable files
    roots: ['${iolist}', '${matrix}', '${user_input}']
    include: [.*]
    exclude: [~\$.*, .*\.bak_.*]
  - title: Generated output
    roots: ['${database_dir}', '${output_root}']
    include: [.*]
    exclude: [~\$.*, .*\.bak_.*]
